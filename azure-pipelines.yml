trigger: none
pr: none

schedules:
  - cron: "0 6 * * *"
    displayName: Daily Rapid7 to Freshservice sync
    branches:
      include:
        - main
    always: true

variables:
  - group: "Patch Automation"
  - name: PYTHON_VERSION
    value: "3.10"

pool:
  name: "Security-Agent-Pool"
  demands:
    - Agent.Name -equals vm-azusvwpbd01-agent

jobs:
  - job: sync
    displayName: Run Rapid7 to Freshservice sync
    steps:
      - checkout: self

      - task: UsePythonVersion@0
        displayName: Use Python $(PYTHON_VERSION)
        inputs:
          versionSpec: "$(PYTHON_VERSION)"

      - script: |
          cd "patch automation"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,azure]"
        displayName: Install dependencies

      - script: |
          cd "patch automation"
          python -m pytest
        displayName: Run tests

      - task: AzureKeyVault@2
        inputs:
          azureSubscription: "Patch Automation"
          KeyVaultName: "kv-patch-automation"
          SecretsFilter: "rapid7-console-username,rapid7-console-password,freshservice-api-key,freshservice-requester-email"
          RunAsPreJob: true

      - script: |
          set -euo pipefail
          cd "patch automation"

          rapid7-freshservice-sync \
            --secret-source env \
            --page-size 250 \
            --output "$(Build.ArtifactStagingDirectory)/rapid7-freshservice-findings.csv" \
            --create-tickets \
            --verbose
        displayName: Run sync job
        env:
          RAPID7_CONSOLE_URL: $(Rapid7-Console-URL)
          RAPID7_CONSOLE_USERNAME: $(Rapid7-Console-Username)
          RAPID7_CONSOLE_PASSWORD: $(Rapid7-Console-Password)
          FRESHSERVICE_DOMAIN: $(Freshservice-Domain)
          FRESHSERVICE_API_KEY: $(Freshservice-API-Key)
          FRESHSERVICE_REQUESTER_EMAIL: $(Freshservice-Requester-Email)

      - task: PublishPipelineArtifact@1
        displayName: Publish CSV output
        inputs:
          targetPath: "$(Build.ArtifactStagingDirectory)/rapid7-freshservice-findings.csv"
          artifact: "rapid7-freshservice-findings"
        condition: succeededOrFailed()
